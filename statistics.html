<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои финансы — Статистика</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script type="module" src="js/statistics-page.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <h1 class="header__logo">💰 Мои финансы</h1>
            <nav class="header__nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item"><a href="transactions.html" class="nav__link">Транзакции</a></li>
                    <li class="nav__item"><a href="statistics.html" class="nav__link nav__link--active">Статистика</a></li>
                </ul>
            </nav>
            <button id="themeToggle" class="btn btn--icon" title="Переключить тему">🌓</button>
        </div>
    </header>

    <main class="main container">
        <section class="stats-section">
            <h2 class="section__title">Статистика</h2>
            
            <!-- График доходов/расходов по месяцам -->
            <div class="chart-container">
                <h3>Динамика по месяцам</h3>
                <canvas id="monthlyChart"></canvas>
            </div>

            <!-- Круговая диаграмма по категориям -->
            <div class="chart-container">
                <h3>Расходы по категориям</h3>
                <canvas id="categoryChart"></canvas>
            </div>

            <!-- Итоговая сводка -->
            <div id="statsSummary" class="stats-summary">
                <!-- Заполняется динамически -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Учебный проект «Мои финансы»</p>
        </div>
    </footer>
</body>
</html>
